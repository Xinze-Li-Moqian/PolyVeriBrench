name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Z3 decides the claims on a re-encoding; CrossHair symbolically executes the
  # real src/estimate_size.py. Seconds to run -- no toolchain, just pip.
  python:
    name: Python (Z3 + CrossHair)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          # CrossHair rewrites bytecode and so is interpreter-version sensitive.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scenarios/estimate_size/verification/python_verification/requirements.txt

      - name: Install pinned tools
        run: pip install -r scenarios/estimate_size/verification/python_verification/requirements.txt

      - name: Verify
        run: ./scripts/check_python.sh

  # Model-checks the real src/estimate_size.rs. The official action is used
  # rather than a hand-rolled install because `cargo kani setup` pulls down a
  # CBMC bundle and the action already knows how to do that.
  kani:
    name: Rust, Kani
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.67.0'
          command: 'cargo-kani'
          working-directory: 'scenarios/estimate_size/verification/rust_verification/kani'

  # Verus ships as a release archive, not something cargo installs, and it
  # refuses to start unless the exact rustc named in its version.json is
  # present. Both are read out of the archive rather than hardcoded, so
  # bumping VERUS_VERSION is the only edit needed.
  verus:
    name: Rust, Verus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERUS_VERSION: 0.2026.08.30.b432e82
    steps:
      - uses: actions/checkout@v5

      - name: Download Verus
        run: |
          set -euo pipefail
          curl -sSfL -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d verus-dist
          bin="$(find verus-dist -maxdepth 3 -type f -name verus | head -1)"
          test -n "$bin" || { echo "no verus binary in the archive"; exit 1; }
          chmod +x "$bin"
          echo "VERUS=$PWD/$bin" >> "$GITHUB_ENV"
          echo "VERUS_DIR=$PWD/$(dirname "$bin")" >> "$GITHUB_ENV"

      - name: Install the rustc Verus pins
        run: |
          set -euo pipefail
          toolchain="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["verus"]["toolchain"])' "$VERUS_DIR/version.json")"
          echo "Verus $VERUS_VERSION requires $toolchain"
          rustup toolchain install "$toolchain"

      - name: Verify
        run: ./scripts/check_rust.sh verus

  # Zero dependencies, toolchain only -- this one is fast and should stay fast.
  native:
    name: Lean, hand-written (v4.33.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: scenarios/estimate_size

      # Builds again (cached, seconds) and then reports the axioms behind every
      # theorem. Fails on sorryAx, on native_decide, or on anything unrecognised.
      - name: Axiom audit
        run: ./scripts/check_axioms.sh native

  # Separate job because this one drags in Mathlib. Kept off the critical path
  # so a broken hand-written proof reports in ~2 minutes rather than ~20.
  aeneas:
    name: Lean, Aeneas-translated Rust (v4.31.0 + Mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # No disk-space cleanup step here: Mathlib unpacks to ~6 GB and the runner
      # reports 104 GB free, so the usual `rm -rf /usr/share/dotnet ...` dance
      # costs 80 seconds and buys nothing.

      # use-github-cache is off on purpose: this project's .lake is ~7.6 GB, far
      # past what actions/cache can carry. Mathlib comes from `lake exe cache
      # get` instead -- the pinned revision is the v4.31.0 tag, so upstream has
      # prebuilt oleans for it and nothing is compiled from source.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: scenarios/estimate_size/verification/rust_verification/aeneas
          use-mathlib-cache: true
          use-github-cache: false

      - name: Axiom audit
        run: ./scripts/check_axioms.sh aeneas
